name: CI

on:
  push:
    branches: ["**"]   # tags are handled by the Release workflow, which calls this file as its gate
  pull_request:
  workflow_dispatch:
  workflow_call:   # the Release workflow runs this whole file as its gate

jobs:
  platform-test:
    # Target-machine tests: the scanner is run the way a user would, on every supported OS and CPU
    # (including macOS Intel and Apple Silicon). See scripts/platform-test.sh for what is checked.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64,   os: ubuntu-latest }
          - { platform: linux-arm64, os: ubuntu-24.04-arm }
          - { platform: macos-x64,   os: macos-15-intel }
          - { platform: macos-arm64, os: macos-latest }
          - { platform: windows-x64, os: windows-latest }
    name: platform-test (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build and unit tests
        run: mvn -B verify

      - name: Target-machine test (auto-download Nuclei, validate templates, false-positive check, fresh-machine run)
        run: scripts/platform-test.sh

  bundle:
    name: bundle (${{ matrix.platform }})
    # Proves the self-contained bundle (native launcher + bundled Java runtime + Nuclei) builds and runs on every
    # supported OS and CPU on every change. The same script produces the release assets.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: windows-x64, os: windows-latest }
          - { platform: linux-x64,   os: ubuntu-latest }
          - { platform: linux-arm64, os: ubuntu-24.04-arm }
          - { platform: macos-x64,   os: macos-15-intel }
          - { platform: macos-arm64, os: macos-latest }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build jar
        run: mvn -B -DskipTests package

      - name: Build and smoke-test the bundle
        run: scripts/build-bundle.sh "${{ matrix.platform }}" "1.0.0-ci"
