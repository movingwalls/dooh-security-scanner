name: Release

# Publishes a GitHub Release when a version tag such as v1.0.0 is pushed.
# Assets:
#   dooh-security-scanner-<version>.zip          portable: jar + templates + launchers (needs Java 17 and Nuclei)
#   dooh-security-scanner-<version>-windows.zip  self-contained: .exe with its own Java runtime + nuclei.exe + templates
# Each asset has a .sha256 file next to it.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  NUCLEI_VERSION: "3.4.10"
  # sha256 of nuclei_3.4.10_windows_amd64.zip, from the official release checksums file
  NUCLEI_WINDOWS_SHA256: "7de765bdd73f1c8ec577e82df8196b3971ecd9efc7061a7cab931bc1a8055c68"

jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build and test
        run: mvn -B verify

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DIR="dooh-security-scanner-${VERSION}"
          mkdir "$DIR"
          cp target/dooh-security-scanner.jar "$DIR/"
          cp -r templates "$DIR/"
          cp README.md LICENSE NOTICE THIRD_PARTY_LICENSES.md SECURITY.md CHANGELOG.md targets.example.txt dooh-scan.sh dooh-scan.bat "$DIR/"
          cp -r docs "$DIR/"
          zip -r "${DIR}.zip" "$DIR"
          sha256sum "${DIR}.zip" > "${DIR}.zip.sha256"

      - name: Create release and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""
          case "$GITHUB_REF_NAME" in *-*) PRE="--prerelease";; esac
          NOTES="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES" ]; then NOTES_ARG="--notes-file $NOTES"; else NOTES_ARG="--generate-notes"; fi
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" $NOTES_ARG $PRE \
            dooh-security-scanner-*.zip dooh-security-scanner-*.zip.sha256

  windows:
    needs: portable
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build (tests already ran in the portable job)
        run: mvn -B -DskipTests package

      - name: Download pinned Nuclei and verify checksum
        run: |
          curl -sSL -o nuclei.zip \
            "https://github.com/projectdiscovery/nuclei/releases/download/v${NUCLEI_VERSION}/nuclei_${NUCLEI_VERSION}_windows_amd64.zip"
          echo "${NUCLEI_WINDOWS_SHA256}  nuclei.zip" | sha256sum -c -
          mkdir nuclei-bin && unzip -q nuclei.zip -d nuclei-bin

      - name: Assemble input folder
        run: |
          mkdir input
          cp target/dooh-security-scanner.jar input/
          cp -r templates input/
          cp nuclei-bin/nuclei.exe input/
          cp LICENSE NOTICE THIRD_PARTY_LICENSES.md input/

      - name: Build self-contained app (bundled Java runtime)
        run: |
          jpackage --type app-image --name dooh-security-scanner \
            --input input --main-jar dooh-security-scanner.jar \
            --main-class com.dooh.DOOHSecurityScanner \
            --win-console --app-version 1.0.0 --vendor "Moving Walls" \
            --dest dist

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp README.md SECURITY.md CHANGELOG.md targets.example.txt dist/dooh-security-scanner/
          cp -r docs dist/dooh-security-scanner/
          cd dist
          7z a "../dooh-security-scanner-${VERSION}-windows.zip" dooh-security-scanner
          cd ..
          sha256sum "dooh-security-scanner-${VERSION}-windows.zip" > "dooh-security-scanner-${VERSION}-windows.zip.sha256"

      - name: Smoke test the executable
        run: dist/dooh-security-scanner/dooh-security-scanner.exe --version

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            dooh-security-scanner-*-windows.zip dooh-security-scanner-*-windows.zip.sha256
