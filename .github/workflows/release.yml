name: Release

# Publishes a GitHub Release when a version tag such as v1.0.0 is pushed, but only after the CI gate (the 'gate'
# job: tests on Linux x64/arm64, macOS Intel/Apple Silicon and Windows) has passed.
# Assets:
#   dooh-security-scanner-<version>.zip          portable: jar + templates + launchers (needs Java 17)
#   dooh-security-scanner-<version>.jar          the single jar on its own (templates packaged inside; needs Java 17)
#   dooh-security-scanner-<version>-<platform>.{zip|tar.gz}  self-contained: native launcher + its own Java runtime +
#       pinned Nuclei + templates (no Java install needed), built natively for each of:
#       windows-x64, linux-x64, linux-arm64, macos-x64 (Intel), macos-arm64 (Apple Silicon)
# Each asset has a .sha256 file next to it.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  gate:
    # Nothing is published unless the full CI passes first: unit tests, the target-machine tests on
    # Linux x64/arm64, macOS Intel/Apple Silicon and Windows, and the bundle builds on all five platforms.
    uses: ./.github/workflows/ci.yml

  portable:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build and test
        run: scripts/mvn-retry.sh -B verify

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DIR="dooh-security-scanner-${VERSION}"
          mkdir "$DIR"
          cp target/dooh-security-scanner.jar "$DIR/"
          cp -r templates "$DIR/"
          cp README.md LICENSE NOTICE THIRD_PARTY_LICENSES.md SECURITY.md CHANGELOG.md targets.example.txt dooh-scan.sh dooh-scan.bat dooh-security-scanner*.bat "$DIR/"
          cp -r docs "$DIR/"
          zip -r "${DIR}.zip" "$DIR"
          sha256sum "${DIR}.zip" > "${DIR}.zip.sha256"
          cp target/dooh-security-scanner.jar "${DIR}.jar"
          sha256sum "${DIR}.jar" > "${DIR}.jar.sha256"

      - name: Create release and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""
          case "$GITHUB_REF_NAME" in *-*) PRE="--prerelease";; esac
          NOTES="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES" ]; then NOTES_ARG="--notes-file $NOTES"; else NOTES_ARG="--generate-notes"; fi
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" $NOTES_ARG $PRE \
            dooh-security-scanner-*.zip dooh-security-scanner-*.zip.sha256 \
            dooh-security-scanner-*.jar dooh-security-scanner-*.jar.sha256

  bundle:
    # jpackage cannot cross-compile, so each bundle is built (and smoke-tested) on a runner of its own OS/CPU.
    # scripts/build-bundle.sh does the work and takes the pinned Nuclei checksum from NucleiInstaller.java.
    needs: portable
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: windows-x64, os: windows-latest }
          - { platform: linux-x64,   os: ubuntu-latest }
          - { platform: linux-arm64, os: ubuntu-24.04-arm }
          - { platform: macos-x64,   os: macos-15-intel }
          - { platform: macos-arm64, os: macos-latest }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build (tests already ran in the portable job)
        run: scripts/mvn-retry.sh -B -DskipTests package

      - name: Build, smoke-test and archive the bundle
        run: scripts/build-bundle.sh "${{ matrix.platform }}" "${GITHUB_REF_NAME#v}"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/dooh-security-scanner-*-${{ matrix.platform }}.*
