id: novastar-player-service-http
info:
  name: NovaStar Taurus Player Service Exposure
  author: security-researcher
  severity: low
  description: Identifies an exposed HTTP-based Player Service API used by NovaStar multimedia players.
  tags: novastar,taurus,api,exposure

http:
  - method: GET
    path:
      - "{{BaseURL}}/api/v1/player/status"
      - "{{BaseURL}}/player/index.html"
      - "{{BaseURL}}/vplayer"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        words:
          - "Taurus"
          - "Multimedia Player"
          - "NovaLCT"
          - "PlayerService"
        condition: or