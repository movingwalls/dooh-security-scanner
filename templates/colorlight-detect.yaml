id: colorlight-cseries-detect

info:
  name: Colorlight C-Series Web Management Interface Detection
  author: security-researcher
  severity: info
  description: Detects the web console login page for Colorlight C-Series Cloud Players.
  classification:
    cpe: cpe:2.3:h:colorlight:c-series:*:*:*:*:*:*:*:*
  tags: tech,colorlight,iot,panel

http:
  - method: GET
    path:
      - "{{BaseURL}}/"
      - "{{BaseURL}}/g2cweb/login.jsp"

    matchers-condition: or
    matchers:
      - type: word
        words:
          - "<title>Colorlight</title>"
          - "<title>C-Series Cloud Player</title>"
          - "Colorlight Cloud Player"
        part: body

      - type: word
        words:
          - "Colorlight-Cloud-Player"
        part: header
