id: novastar-taurus-port-8000

info:
  name: NovaStar Taurus Web Management Portal - Port 8000
  author: security-researcher
  severity: info
  description: Checks for NovaStar Taurus interfaces explicitly running on non-standard port 8000.
  tags: misconfig, novastar, taurus, port8000

http:
  - method: GET
    path:
      - "{{BaseURL}}:8000/"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "ViPlex"
          - "NovaStar"
        condition: or
        part: body

      - type: status
        status:
          - 200