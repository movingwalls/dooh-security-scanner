id: novastar-taurus-http

info:
  name: NovaStar Taurus Web Management Portal - HTTP Detection
  author: security-researcher
  severity: info
  description: Detects the exposure of NovaStar Taurus Series (ViPlex) web management portal over standard HTTP.
  tags: misconfig, novastar, taurus, viplex, panel

http:
  - method: GET
    path:
      - "{{BaseURL}}/"

    matchers-condition: or
    matchers:
      - type: word
        words:
          - "<title>NovaStar</title>"
          - "<title>Taurus</title>"
          - "<title>ViPlex</title>"
        condition: or
        part: body

      - type: word
        words:
          - "NovaStar"
          - "ViPlex"
        condition: and
        part: body