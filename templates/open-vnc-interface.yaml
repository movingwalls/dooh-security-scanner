id: open-vnc-interface

info:
  name: Open VNC Interface Detection
  author: security-compromised
  severity: high
  description: Detects exposed VNC interfaces on port 5900, which could lead to unauthorized remote access if left unauthenticated.
  classification:
    cwe-id: CWE-306
  tags: network,vnc,misconfiguration

tcp:
  - inputs:
      - data: "\n"
    host:
      - "{{Hostname}}:5900"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "RFB 003"
          - "RFB 004"
        part: data

      - type: status
        status:
          - success