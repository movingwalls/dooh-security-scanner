id: samsung-vxt-detect

info:
  name: Samsung VXT Detection
  author: custom
  severity: info
  description: Detects Samsung VXT digital signage cloud-native platform interfaces.
  tags: samsung,vxt,iot,digitalsignage

http:
  - method: GET
    path:
      - "{{BaseURL}}"
    matchers-condition: or
    matchers:
      - type: word
        part: body
        words:
          - "Samsung VXT"
          - "vxt.samsung.com"
      - type: status
        status:
          - 200