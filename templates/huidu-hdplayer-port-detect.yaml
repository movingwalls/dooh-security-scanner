id: huidu-hdplayer-port-detect

info:
  name: Huidu LED Controller Control Port Identification
  author: security-researcher
  severity: info
  description: Identifies open raw TCP control and web management ports associated with Huidu hardware.
  tags: network,huidu,port-detect

network:
  - inputs:
      - data: "\r\n"
    host:
      - "{{Hostname}}"
    # Standard web, cluster, or API ports utilized by the platform
    port: 80, 8080, 5005, 9000 

    matchers-condition: or
    matchers:
      - type: word
        words:
          - "Huidu"
          - "HDPlayer Server"
        case-insensitive: true