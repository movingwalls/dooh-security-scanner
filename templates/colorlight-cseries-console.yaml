id: colorlight-cseries-console

info:
  name: Colorlight C-Series Cloud Player Management Interface - Detect
  author: security-researcher
  severity: info
  description: |
    Detects the web management console and configuration ports for Colorlight C-Series 
    LED Cloud Players. Unprotected exposure of these panels could allow unauthorized 
    display manipulation or device modification.
  metadata:
    product: colorlight_c-series
    vendor: colorlight
  tags: tech,colorlight,iot,led,panel,console

http:
  - method: GET
    path:
      - "{{BaseURL}}/"
      - "{{BaseURL}}/index.html"
      - "{{BaseURL}}/login.html"

    matchers-condition: or
    matchers:
      - type: word
        words:
          - "Colorlight"
          - "Cloud Player"
          - "C3 Player"
          - "C4 Player"
          - "C6 Player"
          - "LED Player"
        case-insensitive: true
        part: body

      - type: word
        words:
          - "Colorlight Cloud Player"
          - "Colorlight Web Console"
        part: title
        case-insensitive: true