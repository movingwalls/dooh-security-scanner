id: novastar-vnnox-panel
info:
  name: NovaStar VNNOX Admin Panel - Detection
  author: security-researcher
  severity: info
  description: Detects the presence of an exposed NovaStar VNNOX management dashboard panel.
  tags: panel,novastar,vnnox,exposure

http:
  - method: GET
    path:
      - "{{BaseURL}}/"
      - "{{BaseURL}}/login"
      - "{{BaseURL}}/vnnox"

    matchers-condition: or
    matchers:
      - type: word
        words:
          - "VNNOX Standard"
          - "VNNOX Cloud"
          - "NovaStar Tech"
          - "vnnox-login"
        condition: or

      - type: word
        part: header
        words:
          - "X-Powered-By: NovaStar"