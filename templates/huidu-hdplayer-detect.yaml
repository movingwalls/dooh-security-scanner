id: huidu-hdplayer-detect

info:
  name: Huidu Technology HDPlayer Web Interface Detection
  author: security-researcher
  severity: info
  description: Detects the presence of the Huidu Technology HDPlayer web management interface.
  reference:
    - https://docs.projectdiscovery.io/templates/introduction
  classification:
    cpe: cpe:2.3:h:huidu:hdplayer:*:*:*:*:*:*:*:*
  tags: tech,huidu,led,hardware,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}/"
      - "{{BaseURL}}/login.html"

    matchers-condition: or
    matchers:
      - type: word
        words:
          - "HDPlayer"
          - "Huidu Technology"
          - "LED Controller Login"
          - "HD-C16"
          - "HD-C36"
        case-insensitive: true

      - type: word
        part: header
        words:
          - "Huidu-WebServer"