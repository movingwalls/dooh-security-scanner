id: novastar-config-exposure
info:
  name: NovaStar Player Service / VPlayer Configuration Leak
  author: security-researcher
  severity: medium
  description: Searches for misconfigured open directories exposing configuration details or device info.
  tags: misconfig,exposure,novastar

http:
  - method: GET
    path:
      - "{{BaseURL}}/config/device.json"
      - "{{BaseURL}}/setting.json"
      - "{{BaseURL}}/.env"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        words:
          - "sn"
          - "deviceId"
          - "aliasName"
          - "terminal"
        condition: or