id: xixun-y-series-body-detect

info:
  name: XiXun Y-Series Controller Detection (Body)
  author: security-researcher
  severity: info
  description: Detects the web management interface of XiXun Y-Series asynchronous controllers using HTML body content.
  tags: tech,xixun,iot,controller

http:
  - method: GET
    path:
      - "{{BaseURL}}/index.html"
      - "{{BaseURL}}/login.html"

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Asynchronous Control System</title>"
          - "xixun"
        case-insensitive: true

      - type: status
        status:
          - 200