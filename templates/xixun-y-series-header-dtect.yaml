id: xixun-y-series-header-detect

info:
  name: XiXun Y-Series Controller Detection (Headers)
  author: security-researcher
  severity: info
  description: Detects the web management interface of XiXun Y-Series asynchronous controllers using HTTP response headers.
  tags: tech,xixun,iot,controller

http:
  - method: GET
    path:
      - "{{BaseURL}}/"

    matchers-condition: and
    matchers:
      - type: word
        part: header
        words:
          - "Server: Xixun Embedded HTTP Server"

      - type: status
        status:
          - 200