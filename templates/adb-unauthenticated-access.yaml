id: adb-unauthenticated-access

info:
  name: Android Debug Bridge (ADB) Unauthenticated Connection
  author: security-researcher
  severity: critical
  description: >
    The remote Android device allows unauthenticated ADB connections via TCP port 5555. 
    Attackers can leverage this to deploy worms (e.g., ADB.Miner), exfiltrate user data, or compromise the device OS.
  reference:
    - https://developer.android.com/tools/adb
    - https://doublepulsar.com
  tags: network,adb,exploit,unauth

tcp:
  - inputs:
      # Hex payload representing an ADB 'CNXN' message:
      # Command: CNXN (43 4e 58 4e)
      # Version: 0x01000000 (00 00 00 01 in little-endian / standard format)
      # Max data: 4096 (00 10 00 00)
      # Identity length and string header data: "host::\0"
      - data: "434e584e00000001001000000700000028240000bcbeb1b2686f73743a3a00"
        type: hex
        
    host:
      - "{{Hostname}}:5555"
    port: 5555

    matchers-condition: and
    matchers:
      # Validates that the device responded with a connection acknowledgement (CNXN)
      - type: word
        encoding: hex
        words:
          - "434e584e" # 'CNXN' hex magic bytes
        part: data

      # Confirms the response contains typical Android system properties text payload (e.g., 'device::', 'ro.product.name=')
      - type: word
        words:
          - "device:"
          - "ro."
        condition: or
        part: data