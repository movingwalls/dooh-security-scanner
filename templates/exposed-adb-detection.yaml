id: exposed-adb-detection

info:
  name: Android Debug Bridge (ADB) Exposed Service
  author: security-researcher
  severity: high
  description: >
    An exposed Android Debug Bridge (ADB) service was detected on the target. 
    Unauthenticated exposure allows remote attackers to execute arbitrary shell commands with root privileges, 
    install malicious APKs, or extract sensitive data.
  reference:
    - https://hacktricks.wiki/en/network-services-pentesting/5555-android-debug-bridge.html
    - https://www.pentestpad.com/port-exploit/port-5555-android-debug-bridge-adb
  classification:
    cwe-id: CWE-306
  tags: network,adb,misconfig,exposed

tcp:
  - inputs:
      - data: "00000000" # Null probe to initiate basic response banner or verification
    host:
      - "{{Hostname}}:5555"
    port: 5555

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "CNXN" # ADB protocol connection handshake prefix
        part: data

      - type: status
        status:
          - success